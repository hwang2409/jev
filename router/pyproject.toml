[project]
name = "jev-router"
version = "0.1.0"
description = "Jev-backed tool router"
requires-python = ">=3.12"
dependencies = ["jm"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
jm = { path = "../jm", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
